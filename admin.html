<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Ishasha Women's Community</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
  <style>
    :root {
      --bg: #f6f1e8; --card: #fff; --ink: #1a2618; --earth: #254a22;
      --gold: #b8923e; --border: #ddd2c0; --muted: #6b7a65; --danger: #b33a3a; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    .shell { width: min(960px, calc(100% - 1.5rem)); margin: 0 auto; padding: 1.5rem 0 3rem; }
    h1 { font-size: 1.5rem; color: var(--earth); margin-bottom: 0.35rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
    .tab { padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .tab.active { background: var(--earth); color: #fff; border-color: var(--earth); }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.15rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--earth); }
    input, textarea, select { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; font: inherit; margin-bottom: 0.75rem; }
    textarea { min-height: 90px; resize: vertical; }
    .btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.55rem 1.1rem; border-radius: 999px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: var(--earth); color: #fff; }
    .btn-gold { background: var(--gold); color: #1a2618; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .list-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 0.85rem; align-items: start; padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
    .list-item img { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.approved { background: #d1fae5; color: #065f46; }
    .login-box { max-width: 360px; margin: 4rem auto; background: #fff; padding: 1.75rem; border-radius: var(--radius); border: 1px solid var(--border); }
    .login-box h2 { margin-bottom: 1rem; color: var(--earth); }
    .msg { padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .msg.ok { background: #d1fae5; color: #065f46; }
    .msg.err { background: #fee2e2; color: #991b1b; }
    .hidden { display: none !important; }
    a.back { color: var(--earth); font-size: 0.9rem; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="loginView" class="shell">
    <div class="login-box">
      <h2>Admin login</h2>
      <p class="sub">Manage slides, album and audience feedback.</p>
      <label for="adminPass">Password</label>
      <input type="password" id="adminPass" placeholder="Enter admin password" />
      <button type="button" class="btn btn-primary" id="loginBtn" style="width:100%;">Log in</button>
      <p id="loginMsg" class="msg err hidden" style="margin-top:0.75rem;"></p>
      <p style="margin-top:1rem;"><a href="index.html" class="back">← Back to site</a></p>
    </div>
  </div>

  <div id="adminView" class="shell hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:0.5rem;">
      <div>
        <h1>Admin panel</h1>
        <p class="sub">Slides · Album · Feedback</p>
      </div>
      <div class="row">
        <a href="index.html" class="btn btn-ghost">View site</a>
        <button type="button" class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="slides">Hero slides</button>
      <button type="button" class="tab" data-tab="album">Album / Events</button>
      <button type="button" class="tab" data-tab="feedback">Feedback</button>
    </div>

    <div class="panel active" id="panel-slides">
      <div class="card">
        <h3 style="margin-bottom:0.75rem;color:var(--earth);">Upload new hero slide (Cloudinary)</h3>
        <label>Title</label>
        <input id="slideTitle" placeholder="e.g. Community group" />
        <label>Short detail</label>
        <textarea id="slideDetail" placeholder="Description…"></textarea>
        <label>Image</label>
        <input type="file" id="slideFile" accept="image/*" />
        <label>Order (lower = earlier)</label>
        <input type="number" id="slideOrder" value="10" />
        <button type="button" class="btn btn-primary" id="addSlideBtn">Upload &amp; save slide</button>
        <p id="slideMsg" class="msg hidden" style="margin-top:0.75rem;"></p>
      </div>
      <div class="card">
        <h3 style="margin-bottom:0.75rem;">Current slides</h3>
        <div id="slidesList"></div>
      </div>
    </div>

    <div class="panel" id="panel-album">
      <div class="card">
        <h3 style="margin-bottom:0.75rem;color:var(--earth);">Add photo / moment / event</h3>
        <label>Type</label>
        <select id="albumType">
          <option value="photo">Photo</option>
          <option value="moment">Moment</option>
          <option value="event">Event</option>
          <option value="calendar">Calendar</option>
        </select>
        <label>Title</label>
        <input id="albumTitle" placeholder="e.g. Coffee harvest day" />
        <label>Description</label>
        <textarea id="albumDesc"></textarea>
        <label>Date</label>
        <input type="date" id="albumDate" />
        <label>Image</label>
        <input type="file" id="albumFile" accept="image/*" />
        <button type="button" class="btn btn-primary" id="addAlbumBtn">Upload &amp; save</button>
        <p id="albumMsg" class="msg hidden" style="margin-top:0.75rem;"></p>
      </div>
      <div class="card">
        <h3 style="margin-bottom:0.75rem;">Album items</h3>
        <div id="albumList"></div>
      </div>
    </div>

    <div class="panel" id="panel-feedback">
      <div class="card">
        <h3 style="margin-bottom:0.5rem;">Audience feedback</h3>
        <p style="color:var(--muted);font-size:0.9rem;margin-bottom:1rem;">Approve so they appear on the site. Delete spam.</p>
        <div id="feedbackList"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
  /* ========== ALL CONFIG + LOGIC IN ONE PLACE ========== */
  const CONFIG = {
    firebase: {
      apiKey: "AIzaSyD_QszWS5bbi20ZESCRKfw1G1-dWK9r51s",
      authDomain: "ishasha.firebaseapp.com",
      databaseURL: "https://ishasha-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ishasha",
      storageBucket: "ishasha.firebasestorage.app",
      messagingSenderId: "100572186224",
      appId: "1:100572186224:web:fd271eddcf44f4f03656b5",
      measurementId: "G-HTC2DJBTSH"
    },
    cloudinary: {
      cloudName: "poczen7o",
      uploadPreset: "ishasha_uploads",
      folder: "ishasha"
    },
    adminPassword: "ishasha-admin"
  };

  let db = null, fbReady = false;
  try {
    firebase.initializeApp(CONFIG.firebase);
    db = firebase.firestore();
    fbReady = true;
  } catch (e) { console.warn("Firebase fallback", e); }

  async function uploadToCloudinary(file, folder) {
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", CONFIG.cloudinary.uploadPreset);
    form.append("folder", folder || CONFIG.cloudinary.folder);
    const res = await fetch("https://api.cloudinary.com/v1_1/" + CONFIG.cloudinary.cloudName + "/image/upload", { method: "POST", body: form });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error?.message || "Upload failed"); }
    const data = await res.json();
    return { url: data.secure_url, publicId: data.public_id };
  }

  async function loadHeroSlides() {
    if (fbReady) {
      const snap = await db.collection("heroSlides").orderBy("order").get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    try { return JSON.parse(localStorage.getItem("ishasha_hero_slides_v2") || "[]"); } catch { return []; }
  }
  async function saveHeroSlide(slide) {
    if (fbReady) {
      if (slide.id) await db.collection("heroSlides").doc(slide.id).update(slide);
      else { const ref = await db.collection("heroSlides").add({ ...slide, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); slide.id = ref.id; }
      return slide;
    }
    const list = await loadHeroSlides();
    if (slide.id) { const i = list.findIndex(s => s.id === slide.id); if (i >= 0) list[i] = slide; }
    else { slide.id = "local_" + Date.now(); list.push(slide); }
    localStorage.setItem("ishasha_hero_slides_v2", JSON.stringify(list));
    return slide;
  }
  async function deleteHeroSlide(id) {
    if (fbReady) { await db.collection("heroSlides").doc(id).delete(); return; }
    localStorage.setItem("ishasha_hero_slides_v2", JSON.stringify((await loadHeroSlides()).filter(s => s.id !== id)));
  }

  async function loadAlbumItems() {
    if (fbReady) {
      const snap = await db.collection("albumItems").orderBy("date", "desc").get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    try { return JSON.parse(localStorage.getItem("ishasha_album_v1") || "[]"); } catch { return []; }
  }
  async function saveAlbumItem(item) {
    if (fbReady) {
      if (item.id) await db.collection("albumItems").doc(item.id).update(item);
      else { const ref = await db.collection("albumItems").add({ ...item, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); item.id = ref.id; }
      return item;
    }
    const list = await loadAlbumItems();
    if (item.id) { const i = list.findIndex(x => x.id === item.id); if (i >= 0) list[i] = item; }
    else { item.id = "local_" + Date.now(); list.unshift(item); }
    localStorage.setItem("ishasha_album_v1", JSON.stringify(list));
    return item;
  }
  async function deleteAlbumItem(id) {
    if (fbReady) { await db.collection("albumItems").doc(id).delete(); return; }
    localStorage.setItem("ishasha_album_v1", JSON.stringify((await loadAlbumItems()).filter(i => i.id !== id)));
  }

  async function loadAllFeedback() {
    if (fbReady) {
      const snap = await db.collection("feedback").orderBy("createdAt", "desc").get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    try { return JSON.parse(localStorage.getItem("ishasha_feedback_v1") || "[]"); } catch { return []; }
  }
  async function setFeedbackStatus(id, status) {
    if (fbReady) { await db.collection("feedback").doc(id).update({ status }); return; }
    const list = JSON.parse(localStorage.getItem("ishasha_feedback_v1") || "[]");
    const item = list.find(f => f.id === id); if (item) item.status = status;
    localStorage.setItem("ishasha_feedback_v1", JSON.stringify(list));
  }
  async function deleteFeedback(id) {
    if (fbReady) { await db.collection("feedback").doc(id).delete(); return; }
    localStorage.setItem("ishasha_feedback_v1", JSON.stringify((JSON.parse(localStorage.getItem("ishasha_feedback_v1") || "[]")).filter(f => f.id !== id)));
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function formatDate(v) {
    if (!v) return "";
    try { if (v.toDate) return v.toDate().toLocaleDateString(); return new Date(v).toLocaleDateString(); } catch { return String(v).slice(0, 10); }
  }

  const AUTH_KEY = "ishasha_admin_ok";
  function isLoggedIn() { return sessionStorage.getItem(AUTH_KEY) === "1"; }
  function showAdmin() {
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("adminView").classList.remove("hidden");
    refreshSlides(); refreshAlbum(); refreshFeedback();
  }
  function showLogin() {
    document.getElementById("loginView").classList.remove("hidden");
    document.getElementById("adminView").classList.add("hidden");
  }

  document.getElementById("loginBtn").addEventListener("click", () => {
    if (document.getElementById("adminPass").value === CONFIG.adminPassword) {
      sessionStorage.setItem(AUTH_KEY, "1"); showAdmin();
    } else {
      const m = document.getElementById("loginMsg");
      m.textContent = "Wrong password"; m.classList.remove("hidden");
    }
  });
  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem(AUTH_KEY); showLogin();
  });

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  async function refreshSlides() {
    const list = await loadHeroSlides();
    const el = document.getElementById("slidesList");
    if (!list.length) { el.innerHTML = "<p style='color:var(--muted)'>No slides yet.</p>"; return; }
    el.innerHTML = list.map(s =>
      '<div class="list-item"><img src="' + (s.url || "") + '" alt="" /><div><strong>' + escapeHtml(s.title || "") +
      '</strong><p style="font-size:0.85rem;color:var(--muted);margin-top:0.2rem;">' + escapeHtml((s.detail || "").slice(0, 120)) +
      '</p><p style="font-size:0.75rem;color:var(--muted);">Order: ' + (s.order ?? "—") + '</p></div>' +
      '<button type="button" class="btn btn-danger" data-del-slide="' + s.id + '">Delete</button></div>'
    ).join("");
    el.querySelectorAll("[data-del-slide]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this slide?")) return;
        await deleteHeroSlide(btn.dataset.delSlide); refreshSlides();
      });
    });
  }

  document.getElementById("addSlideBtn").addEventListener("click", async () => {
    const msg = document.getElementById("slideMsg");
    const file = document.getElementById("slideFile").files[0];
    const title = document.getElementById("slideTitle").value.trim();
    const detail = document.getElementById("slideDetail").value.trim();
    const order = parseInt(document.getElementById("slideOrder").value, 10) || 10;
    if (!file || !title) { msg.className = "msg err"; msg.textContent = "Title and image required."; msg.classList.remove("hidden"); return; }
    msg.className = "msg"; msg.textContent = "Uploading to Cloudinary…"; msg.classList.remove("hidden");
    try {
      const up = await uploadToCloudinary(file, "ishasha/slides");
      await saveHeroSlide({ title, detail, url: up.url, publicId: up.publicId, order });
      msg.className = "msg ok"; msg.textContent = "Slide saved.";
      document.getElementById("slideTitle").value = "";
      document.getElementById("slideDetail").value = "";
      document.getElementById("slideFile").value = "";
      refreshSlides();
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message || "Upload failed"; }
  });

  async function refreshAlbum() {
    const list = await loadAlbumItems();
    const el = document.getElementById("albumList");
    if (!list.length) { el.innerHTML = "<p style='color:var(--muted)'>No album items yet.</p>"; return; }
    el.innerHTML = list.map(i =>
      '<div class="list-item"><img src="' + (i.url || "") + '" alt="" /><div><span class="badge approved">' +
      escapeHtml(i.type || "photo") + '</span><strong style="display:block;margin-top:0.25rem;">' + escapeHtml(i.title || "") +
      '</strong><p style="font-size:0.85rem;color:var(--muted);">' + escapeHtml((i.description || "").slice(0, 100)) +
      '</p><p style="font-size:0.75rem;color:var(--muted);">' + (i.date || "") + '</p></div>' +
      '<button type="button" class="btn btn-danger" data-del-album="' + i.id + '">Delete</button></div>'
    ).join("");
    el.querySelectorAll("[data-del-album]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete?")) return;
        await deleteAlbumItem(btn.dataset.delAlbum); refreshAlbum();
      });
    });
  }

  document.getElementById("addAlbumBtn").addEventListener("click", async () => {
    const msg = document.getElementById("albumMsg");
    const file = document.getElementById("albumFile").files[0];
    const title = document.getElementById("albumTitle").value.trim();
    const description = document.getElementById("albumDesc").value.trim();
    const type = document.getElementById("albumType").value;
    const date = document.getElementById("albumDate").value || new Date().toISOString().slice(0, 10);
    if (!file || !title) { msg.className = "msg err"; msg.textContent = "Title and image required."; msg.classList.remove("hidden"); return; }
    msg.className = "msg"; msg.textContent = "Uploading…"; msg.classList.remove("hidden");
    try {
      const up = await uploadToCloudinary(file, "ishasha/album");
      await saveAlbumItem({ title, description, type, date, url: up.url, publicId: up.publicId });
      msg.className = "msg ok"; msg.textContent = "Saved.";
      document.getElementById("albumTitle").value = "";
      document.getElementById("albumDesc").value = "";
      document.getElementById("albumFile").value = "";
      refreshAlbum();
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message || "Failed"; }
  });

  async function refreshFeedback() {
    const list = await loadAllFeedback();
    const el = document.getElementById("feedbackList");
    if (!list.length) { el.innerHTML = "<p style='color:var(--muted)'>No feedback yet.</p>"; return; }
    el.innerHTML = list.map(f =>
      '<div class="list-item" style="grid-template-columns:60px 1fr auto;">' +
      '<img src="' + (f.photoUrl || "images/logo.jpg") + '" alt="" style="width:60px;height:60px;border-radius:50%;object-fit:cover;" />' +
      '<div><span class="badge ' + (f.status === "approved" ? "approved" : "pending") + '">' + (f.status || "pending") +
      '</span><strong style="display:block;margin-top:0.2rem;">' + escapeHtml(f.name || "Anonymous") +
      '</strong><p style="font-size:0.9rem;margin-top:0.25rem;">' + escapeHtml(f.message || "") +
      '</p><p style="font-size:0.75rem;color:var(--muted);">' + formatDate(f.date || f.createdAt) + '</p></div>' +
      '<div class="row" style="flex-direction:column;gap:0.35rem;">' +
      (f.status !== "approved"
        ? '<button type="button" class="btn btn-gold" data-approve="' + f.id + '">Approve</button>'
        : '<button type="button" class="btn btn-ghost" data-pending="' + f.id + '">Unapprove</button>') +
      '<button type="button" class="btn btn-danger" data-del-fb="' + f.id + '">Delete</button></div></div>'
    ).join("");
    el.querySelectorAll("[data-approve]").forEach(btn => {
      btn.addEventListener("click", async () => { await setFeedbackStatus(btn.dataset.approve, "approved"); refreshFeedback(); });
    });
    el.querySelectorAll("[data-pending]").forEach(btn => {
      btn.addEventListener("click", async () => { await setFeedbackStatus(btn.dataset.pending, "pending"); refreshFeedback(); });
    });
    el.querySelectorAll("[data-del-fb]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete?")) return;
        await deleteFeedback(btn.dataset.delFb); refreshFeedback();
      });
    });
  }

  if (isLoggedIn()) showAdmin();
  </script>
</body>
</html>
