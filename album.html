<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Album · Moments, Events & Photos | Ishasha Women's Community</title>
  <meta name="description" content="Photos, moments, events and calendar from Ishasha Women's Community in Kanungu, Uganda." />
  <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
  <style>
    :root {
      --bg: #f6f1e8; --sand: #efe6d6; --card: #fff; --ink: #1a2618; --ink-soft: #3a4a36;
      --muted: #6b7a65; --earth: #254a22; --gold: #b8923e; --gold-light: #d4b56a;
      --border: #ddd2c0; --radius: 14px; --shadow: 0 10px 30px rgba(26,38,24,0.08);
      --font: system-ui, sans-serif; --display: Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1140px, calc(100% - 2rem)); margin-inline: auto; }
    .site-header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: 0.65rem; }
    .brand-logo { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-light); }
    .brand-name { font-family: var(--display); font-size: 0.95rem; font-weight: 700; color: var(--earth); }
    .nav-desktop { display: flex; gap: 0.15rem; flex-wrap: wrap; }
    .nav-desktop a { padding: 0.4rem 0.55rem; border-radius: 8px; font-size: 0.85rem; color: var(--ink-soft); }
    .nav-desktop a:hover, .nav-desktop a.active { background: color-mix(in srgb, var(--gold) 16%, white); color: var(--earth); }
    .btn-donate { padding: 0.5rem 1rem; border-radius: 999px; background: linear-gradient(135deg, var(--earth), #1a3518); color: #fff; font-weight: 600; font-size: 0.85rem; }
    .page-hero { padding: 2.5rem 0 1.5rem; border-bottom: 1px solid var(--border); background: var(--card); }
    .eyebrow { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
    .page-title { font-family: var(--display); font-size: clamp(1.6rem, 3.5vw, 2.2rem); color: var(--earth); margin-bottom: 0.4rem; }
    .page-lead { color: var(--ink-soft); max-width: 36rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 1.25rem 0; }
    .filter-btn { padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
    .filter-btn.active { background: var(--earth); color: #fff; border-color: var(--earth); }
    .slider-wrap { position: relative; padding-bottom: 2.5rem; }
    .grid {
      display: flex; gap: 1.15rem; overflow-x: auto; scroll-snap-type: x mandatory;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
      padding: 0.25rem 0.1rem 1rem; scrollbar-width: none;
    }
    .grid::-webkit-scrollbar { display: none; }
    .card {
      flex: 0 0 min(280px, 82vw); scroll-snap-align: start;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);
    }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 1rem 1.1rem 1.15rem; }
    .card-type { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); margin-bottom: 0.25rem; }
    .card h3 { font-family: var(--display); font-size: 1.05rem; color: var(--earth); margin-bottom: 0.3rem; }
    .card p { font-size: 0.9rem; color: var(--ink-soft); }
    .card-date { font-size: 0.78rem; color: var(--muted); margin-top: 0.5rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); width: 100%; }
    .slider-btn {
      position: absolute; top: 38%; transform: translateY(-50%); z-index: 2;
      width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(37, 74, 34, 0.92); color: #fff; font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .slider-btn.prev { left: -0.25rem; }
    .slider-btn.next { right: -0.25rem; }
    .slider-dots { display: flex; justify-content: center; gap: 0.4rem; margin-top: 0.25rem; }
    .slider-dots button {
      width: 8px; height: 8px; border-radius: 50%; border: none;
      background: rgba(37, 74, 34, 0.25); cursor: pointer; padding: 0;
    }
    .slider-dots button.active { background: var(--earth); transform: scale(1.25); }
    .site-footer { background: color-mix(in srgb, var(--sand) 55%, var(--card)); border-top: 1px solid var(--border); padding: 1.5rem 0; text-align: center; font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 800px) { .nav-desktop { display: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.jpg" alt="" class="brand-logo" onerror="this.style.display='none'" />
        <span class="brand-name">Ishasha Women's Community</span>
      </a>
      <nav class="nav-desktop">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="programs.html">Programs</a>
        <a href="tourism.html">Tourism</a>
        <a href="album.html" class="active">Album</a>
        <a href="get-involved.html">Get Involved</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a href="donate.html" class="btn-donate">Donate</a>
    </div>
  </header>

  <section class="page-hero">
    <div class="shell">
      <p class="eyebrow">Photos · Moments · Events</p>
      <h1 class="page-title">Our album</h1>
      <p class="page-lead">Moments from the community, farm days, cultural events and the stories that shape Ishasha.</p>
    </div>
  </section>

  <div class="shell">
    <div class="filters" id="filters">
      <button type="button" class="filter-btn active" data-type="all">All</button>
      <button type="button" class="filter-btn" data-type="photo">Photos</button>
      <button type="button" class="filter-btn" data-type="moment">Moments</button>
      <button type="button" class="filter-btn" data-type="event">Events</button>
      <button type="button" class="filter-btn" data-type="calendar">Calendar</button>
    </div>
    <div class="slider-wrap">
      <button type="button" class="slider-btn prev" id="albumPrev" aria-label="Previous">‹</button>
      <button type="button" class="slider-btn next" id="albumNext" aria-label="Next">›</button>
      <div class="grid" id="albumGrid"></div>
      <div class="slider-dots" id="albumDots"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="shell"><p>© <span id="year"></span> Ishasha Women's Community Skilling and Development Organisation</p></div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
  const CONFIG = {
    firebase: {
      apiKey: "AIzaSyD_QszWS5bbi20ZESCRKfw1G1-dWK9r51s",
      authDomain: "ishasha.firebaseapp.com",
      databaseURL: "https://ishasha-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ishasha",
      storageBucket: "ishasha.firebasestorage.app",
      messagingSenderId: "100572186224",
      appId: "1:100572186224:web:fd271eddcf44f4f03656b5",
      measurementId: "G-HTC2DJBTSH"
    }
  };

  let db = null, fbReady = false;
  try {
    firebase.initializeApp(CONFIG.firebase);
    db = firebase.firestore();
    fbReady = true;
  } catch (e) { console.warn(e); }

  async function loadAlbumItems(typeFilter) {
    if (fbReady) {
      let q = db.collection("albumItems").orderBy("date", "desc");
      if (typeFilter && typeFilter !== "all") {
        q = db.collection("albumItems").where("type", "==", typeFilter).orderBy("date", "desc");
      }
      const snap = await q.get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    try {
      let list = JSON.parse(localStorage.getItem("ishasha_album_v1") || "[]");
      if (typeFilter && typeFilter !== "all") list = list.filter(i => i.type === typeFilter);
      return list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    } catch { return []; }
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  let currentType = "all";

  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function setupAlbumSlider() {
    const track = document.getElementById("albumGrid");
    const prev = document.getElementById("albumPrev");
    const next = document.getElementById("albumNext");
    const dotsEl = document.getElementById("albumDots");
    function cardWidth() {
      const card = track.querySelector(".card");
      if (!card) return 300;
      const gap = 18;
      return card.offsetWidth + gap;
    }
    function scrollByDir(dir) {
      track.scrollBy({ left: dir * cardWidth(), behavior: "smooth" });
    }
    prev.onclick = () => scrollByDir(-1);
    next.onclick = () => scrollByDir(1);
    function updateDots() {
      const cards = track.querySelectorAll(".card");
      if (!cards.length) { dotsEl.innerHTML = ""; return; }
      const idx = Math.round(track.scrollLeft / cardWidth());
      dotsEl.innerHTML = Array.from(cards).map((_, i) =>
        '<button type="button" class="' + (i === idx ? "active" : "") + '" data-i="' + i + '"></button>'
      ).join("");
      dotsEl.querySelectorAll("button").forEach(b => {
        b.onclick = () => track.scrollTo({ left: (+b.dataset.i) * cardWidth(), behavior: "smooth" });
      });
    }
    track.onscroll = () => { clearTimeout(track._t); track._t = setTimeout(updateDots, 60); };
    updateDots();
    clearInterval(window._albumAuto);
    window._albumAuto = setInterval(() => {
      const max = track.scrollWidth - track.clientWidth - 4;
      if (track.scrollLeft >= max) track.scrollTo({ left: 0, behavior: "smooth" });
      else scrollByDir(1);
    }, 4800);
  }

  async function render() {
    const items = await loadAlbumItems(currentType);
    const grid = document.getElementById("albumGrid");
    if (!items.length) {
      grid.innerHTML = '<p class="empty">No items yet. Admin can add photos and events from the admin panel.</p>';
      document.getElementById("albumDots").innerHTML = "";
      return;
    }
    grid.innerHTML = items.map(i =>
      '<article class="card"><img src="' + (i.url || "") + '" alt="" loading="lazy" />' +
      '<div class="card-body"><p class="card-type">' + escapeHtml(i.type || "photo") + '</p>' +
      '<h3>' + escapeHtml(i.title || "") + '</h3><p>' + escapeHtml(i.description || "") +
      '</p><p class="card-date">' + (i.date || "") + '</p></div></article>'
    ).join("");
    setupAlbumSlider();
  }

  document.getElementById("filters").addEventListener("click", e => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    render();
  });

  render();
  </script>
</body>
</html>
